name: Validate Dub Priority

on:
  push:
    branches:
      - test/dub-priority-v2
    paths:
      - 'Russian-Custom-Formats-Dub-Priority/**'
      - 'scripts/validate-formats.mjs'
      - 'tests/**'
      - 'scripts/sync-scores.mjs'
      - '.github/workflows/validate-dub-priority.yml'
  pull_request:
    paths:
      - 'Russian-Custom-Formats-Dub-Priority/**'
      - 'scripts/validate-formats.mjs'
      - 'tests/**'
      - 'scripts/sync-scores.mjs'
      - '.github/workflows/validate-dub-priority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JSON and CSV consistency
        run: node scripts/validate-formats.mjs
      - name: Regression tests
        run: node --test tests/*.test.mjs
