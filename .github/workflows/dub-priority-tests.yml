name: Dub Priority regression checks

on:
  push:
    branches:
      - test/dub-priority-v2
    paths:
      - 'Russian-Custom-Formats-Dub-Priority/**'
      - 'tests/**'
      - '.github/workflows/dub-priority-tests.yml'
  pull_request:
    paths:
      - 'Russian-Custom-Formats-Dub-Priority/**'
      - 'tests/**'
      - '.github/workflows/dub-priority-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Custom Format regression suite
        run: node --test tests/*.test.mjs
